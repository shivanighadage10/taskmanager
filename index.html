<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS CDN -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding: 20px;
        }
        .task-item {
            margin-bottom: 10px;
        }
        .edit-input {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center">Task Manager</h2>
    
    <div class="form-group">
        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task">
        <button id="addTask" class="btn btn-primary mt-2">Add Task</button>
    </div>

    <ul id="taskList" class="list-group mt-4"></ul>
</div>

<!-- jQuery and Bootstrap JS CDN -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Include script below -->
<script src="task-manager.js"></script>

</body>
</html>
